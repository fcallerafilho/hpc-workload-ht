<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 706" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="pin" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,0 L5,10 z" fill="#d03b3b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="706" fill="#fcfcfb"/>

  <text x="460" y="36" text-anchor="middle" font-size="22" font-weight="650" fill="#0b0b0b">How to read our PR-AUC score</text>
  <text x="460" y="57" text-anchor="middle" font-size="12.5" fill="#52514e">The baseline, why it is the failure rate, and what higher scores would mean</text>

  <!-- ============ Panel 1 ============ -->
  <text x="60" y="92" font-size="13" font-weight="650" fill="#2a78d6">1 - What is the baseline?</text>

  <!-- 5x5 grid: 1 in 25 windows fails (~4%) -->
  <rect x="64"  y="112" width="20" height="20" rx="3" fill="#dfe3e8"/>
  <rect x="90"  y="112" width="20" height="20" rx="3" fill="#dfe3e8"/>
  <rect x="116" y="112" width="20" height="20" rx="3" fill="#dfe3e8"/>
  <rect x="142" y="112" width="20" height="20" rx="3" fill="#dfe3e8"/>
  <rect x="168" y="112" width="20" height="20" rx="3" fill="#dfe3e8"/>
  <rect x="64"  y="138" width="20" height="20" rx="3" fill="#dfe3e8"/>
  <rect x="90"  y="138" width="20" height="20" rx="3" fill="#dfe3e8"/>
  <rect x="116" y="138" width="20" height="20" rx="3" fill="#dfe3e8"/>
  <rect x="142" y="138" width="20" height="20" rx="3" fill="#dfe3e8"/>
  <rect x="168" y="138" width="20" height="20" rx="3" fill="#dfe3e8"/>
  <rect x="64"  y="164" width="20" height="20" rx="3" fill="#dfe3e8"/>
  <rect x="90"  y="164" width="20" height="20" rx="3" fill="#dfe3e8"/>
  <rect x="116" y="164" width="20" height="20" rx="3" fill="#eb6834"/>
  <rect x="142" y="164" width="20" height="20" rx="3" fill="#dfe3e8"/>
  <rect x="168" y="164" width="20" height="20" rx="3" fill="#dfe3e8"/>
  <rect x="64"  y="190" width="20" height="20" rx="3" fill="#dfe3e8"/>
  <rect x="90"  y="190" width="20" height="20" rx="3" fill="#dfe3e8"/>
  <rect x="116" y="190" width="20" height="20" rx="3" fill="#dfe3e8"/>
  <rect x="142" y="190" width="20" height="20" rx="3" fill="#dfe3e8"/>
  <rect x="168" y="190" width="20" height="20" rx="3" fill="#dfe3e8"/>
  <rect x="64"  y="216" width="20" height="20" rx="3" fill="#dfe3e8"/>
  <rect x="90"  y="216" width="20" height="20" rx="3" fill="#dfe3e8"/>
  <rect x="116" y="216" width="20" height="20" rx="3" fill="#dfe3e8"/>
  <rect x="142" y="216" width="20" height="20" rx="3" fill="#dfe3e8"/>
  <rect x="168" y="216" width="20" height="20" rx="3" fill="#dfe3e8"/>
  <rect x="116" y="164" width="20" height="20" rx="3" fill="none" stroke="#b0430f" stroke-width="1.2"/>
  <text x="126" y="250" text-anchor="middle" font-size="10.5" fill="#b0430f">= a failure</text>

  <text x="212" y="126" font-size="13" fill="#0b0b0b">About <tspan font-weight="650">1 in 25</tspan> test windows (~4%) is truly</text>
  <text x="212" y="144" font-size="13" fill="#0b0b0b">&#8220;about to fail&#8221; &#8212; the rest are healthy.</text>
  <text x="212" y="176" font-size="13" fill="#0b0b0b">A blind guess that knows only this rate</text>
  <text x="212" y="194" font-size="13" fill="#0b0b0b">already scores that rate as its PR-AUC.</text>

  <rect x="620" y="104" width="240" height="128" rx="12" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="740" y="162" text-anchor="middle" font-size="36" font-weight="650" fill="#1c5cab">0.0403</text>
  <text x="740" y="188" text-anchor="middle" font-size="12.5" fill="#0b0b0b">random-guess baseline</text>
  <text x="740" y="207" text-anchor="middle" font-size="11.5" fill="#52514e">= the test-set failure rate</text>
  <text x="740" y="224" text-anchor="middle" font-size="11" fill="#52514e">every model must beat this</text>

  <line x1="60" y1="266" x2="860" y2="266" stroke="#e1e0d9" stroke-width="1"/>

  <!-- ============ Panel 2 ============ -->
  <text x="60" y="292" font-size="13" font-weight="650" fill="#2a78d6">2 - Why is 0.0403 the baseline?</text>

  <!-- mini PR plot -->
  <line x1="95" y1="315" x2="95" y2="440" stroke="#898781" stroke-width="1.2"/>
  <line x1="95" y1="440" x2="385" y2="440" stroke="#898781" stroke-width="1.2"/>
  <text x="240" y="458" text-anchor="middle" font-size="10.5" fill="#898781">recall &#8594;</text>
  <text x="82" y="378" text-anchor="middle" font-size="10.5" fill="#898781" transform="rotate(-90 82 378)">precision &#8594;</text>
  <!-- random flat line near the failure rate -->
  <line x1="95" y1="427" x2="385" y2="427" stroke="#d03b3b" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="240" y="421" text-anchor="middle" font-size="10" fill="#d03b3b">random = flat at 0.0403</text>
  <!-- a real model curve -->
  <path d="M95,350 Q 210,398 385,418" fill="none" stroke="#2a78d6" stroke-width="2"/>
  <text x="188" y="352" font-size="10.5" fill="#2a78d6">a real model</text>
  <text x="240" y="472" text-anchor="middle" font-size="9" fill="#898781">(precision axis stretched near 0)</text>

  <text x="410" y="330" font-size="12.5" fill="#0b0b0b">A random guess has precision = the failure rate at</text>
  <text x="410" y="348" font-size="12.5" fill="#0b0b0b">every recall, so its PR curve is a flat line &#8212; and the</text>
  <text x="410" y="366" font-size="12.5" fill="#0b0b0b">area under it (that <tspan font-style="italic">is</tspan> PR-AUC) equals <tspan font-weight="650">0.0403</tspan>.</text>
  <text x="410" y="394" font-size="12" fill="#0b0b0b">It is the <tspan font-weight="650">TEST</tspan> failure rate, counting positive</text>
  <text x="410" y="412" font-size="12" fill="#0b0b0b">windows (majority-vote) &#8212; the unit we score on.</text>
  <text x="410" y="438" font-size="12" fill="#52514e">(ROC-AUC&#8217;s baseline is 0.5, not 0.)</text>

  <line x1="60" y1="484" x2="860" y2="484" stroke="#e1e0d9" stroke-width="1"/>

  <!-- ============ Panel 3 ============ -->
  <text x="60" y="510" font-size="13" font-weight="650" fill="#2a78d6">3 - What would different scores mean?</text>
  <text x="60" y="528" font-size="11.5" fill="#52514e">Read PR-AUC as a multiple (x-lift) of the 0.0403 baseline &#8212; each step doubles.</text>

  <!-- band names -->
  <text x="101" y="556" text-anchor="middle" font-size="10.5" fill="#52514e">~random</text>
  <text x="183" y="556" text-anchor="middle" font-size="10.5" fill="#52514e">weak</text>
  <text x="326" y="556" text-anchor="middle" font-size="10.5" fill="#0b0b0b">moderate</text>
  <text x="490" y="556" text-anchor="middle" font-size="10.5" fill="#0b0b0b">strong</text>
  <text x="706" y="556" text-anchor="middle" font-size="10.5" fill="#ffffff">excellent</text>

  <!-- bands (log2 x-lift axis: 1x..24.8x = perfect) -->
  <rect x="80"  y="562" width="43"  height="28" fill="#dfe3e8"/>
  <rect x="123" y="562" width="121" height="28" fill="#cde2fb"/>
  <rect x="244" y="562" width="164" height="28" fill="#9ec5f4"/>
  <rect x="408" y="562" width="164" height="28" fill="#6da7ec"/>
  <rect x="572" y="562" width="268" height="28" fill="#3987e5"/>
  <rect x="80"  y="562" width="760" height="28" fill="none" stroke="#c3c2b7" stroke-width="1"/>

  <!-- ticks: value + PR-AUC -->
  <g font-size="11" fill="#0b0b0b" text-anchor="middle">
    <text x="80"  y="606" font-weight="600">1x</text>
    <text x="244" y="606" font-weight="600">2x</text>
    <text x="408" y="606" font-weight="600">4x</text>
    <text x="572" y="606" font-weight="600">8x</text>
    <text x="736" y="606" font-weight="600">16x</text>
    <text x="840" y="606" font-weight="600">perfect</text>
  </g>
  <g font-size="10" fill="#898781" text-anchor="middle">
    <text x="80"  y="620">0.040</text>
    <text x="244" y="620">0.081</text>
    <text x="408" y="620">0.161</text>
    <text x="572" y="620">0.322</text>
    <text x="736" y="620">0.645</text>
    <text x="840" y="620">1.0</text>
  </g>

  <!-- "we are here" marker at ~2.1x -->
  <line x1="252" y1="548" x2="252" y2="561" stroke="#d03b3b" stroke-width="1.6" marker-end="url(#pin)"/>
  <text x="300" y="544" text-anchor="middle" font-size="11" font-weight="650" fill="#d03b3b">we are here: 0.079 &#8594; 0.086 (~2x)</text>

  <!-- bottom line -->
  <rect x="60" y="642" width="800" height="50" rx="10" fill="#e7f6ef" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="460" y="664" text-anchor="middle" font-size="13" font-weight="650" fill="#0b0b0b">Bottom line: our best model scores ~2x the baseline &#8212; a real but modest signal.</text>
  <text x="460" y="683" text-anchor="middle" font-size="11.5" fill="#52514e">Reaching &#8220;strong&#8221; (4x = 0.16) or &#8220;excellent&#8221; (8x = 0.32) would need pipeline/feature changes, not just tuning.</text>
</svg>
