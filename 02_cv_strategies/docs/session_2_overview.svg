<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#898781"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="560" fill="#fcfcfb"/>

  <text x="460" y="32" text-anchor="middle" font-size="21" font-weight="650" fill="#0b0b0b">What Session 2 did</text>
  <text x="460" y="52" text-anchor="middle" font-size="12.5" fill="#52514e">Fix how we judge and tune the node-failure models — no change to the data pipeline</text>

  <!-- Band 1 -->
  <text x="60" y="84" font-size="12" fill="#898781">1 &#183; Where Session 1 left us</text>
  <rect x="60" y="90" width="800" height="58" rx="10" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="460" y="114" text-anchor="middle" font-size="13.5" fill="#0b0b0b">Session 1 = train 15 models once (<tspan font-weight="650">Pass 1</tspan>) + grid-search their best settings (<tspan font-weight="650">Pass 2</tspan>)</text>
  <text x="460" y="134" text-anchor="middle" font-size="12.5" fill="#d03b3b">Problem: scores looked weak — and the Pass 2 grid search made them WORSE (a regression)</text>
  <line x1="460" y1="148" x2="460" y2="172" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Band 2 -->
  <text x="60" y="190" font-size="12" fill="#898781">2 &#183; Three problems, three fixes</text>
  <!-- col 1 -->
  <rect x="70" y="198" width="240" height="50" rx="9" fill="#fbe9e7" stroke="#d03b3b" stroke-width="1.3"/>
  <text x="190" y="220" text-anchor="middle" font-size="12.5" fill="#0b0b0b">The baseline was guessed</text>
  <text x="190" y="237" text-anchor="middle" font-size="11" fill="#52514e">(used 0.032 — the wrong number)</text>
  <line x1="190" y1="248" x2="190" y2="268" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="70" y="270" width="240" height="52" rx="9" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.3"/>
  <text x="190" y="292" text-anchor="middle" font-size="12.5" fill="#0b0b0b">Baseline = test failure rate</text>
  <text x="190" y="309" text-anchor="middle" font-size="12.5" font-weight="650" fill="#0b0b0b">0.0403 (proven)</text>
  <!-- col 2 -->
  <rect x="340" y="198" width="240" height="50" rx="9" fill="#fbe9e7" stroke="#d03b3b" stroke-width="1.3"/>
  <text x="460" y="220" text-anchor="middle" font-size="12.5" fill="#0b0b0b">Pass 2 used a LEAKY</text>
  <text x="460" y="237" text-anchor="middle" font-size="12.5" fill="#0b0b0b">cross-validation</text>
  <line x1="460" y1="248" x2="460" y2="268" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="340" y="270" width="240" height="52" rx="9" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.3"/>
  <text x="460" y="292" text-anchor="middle" font-size="12.5" fill="#0b0b0b">Honest CV: keep each job</text>
  <text x="460" y="309" text-anchor="middle" font-size="12.5" font-weight="650" fill="#0b0b0b">whole + respect TIME</text>
  <!-- col 3 -->
  <rect x="610" y="198" width="240" height="50" rx="9" fill="#fbe9e7" stroke="#d03b3b" stroke-width="1.3"/>
  <text x="730" y="220" text-anchor="middle" font-size="12.5" fill="#0b0b0b">No way to answer</text>
  <text x="730" y="237" text-anchor="middle" font-size="12.5" fill="#0b0b0b">&#8220;is this score good?&#8221;</text>
  <line x1="730" y1="248" x2="730" y2="268" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="610" y="270" width="240" height="52" rx="9" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.3"/>
  <text x="730" y="292" text-anchor="middle" font-size="12.5" fill="#0b0b0b">x-lift + verdict bands</text>
  <text x="730" y="309" text-anchor="middle" font-size="12.5" font-weight="650" fill="#0b0b0b">+ operating point</text>

  <line x1="460" y1="322" x2="460" y2="348" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Band 3 -->
  <text x="60" y="366" font-size="12" fill="#898781">3 &#183; The key discovery</text>
  <rect x="60" y="372" width="800" height="60" rx="10" fill="#e7f6ef" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="460" y="396" text-anchor="middle" font-size="13.5" font-weight="650" fill="#0b0b0b">Grouping by job is necessary but NOT enough — the check must respect TIME.</text>
  <text x="460" y="416" text-anchor="middle" font-size="12" fill="#52514e">A same-period check wants too many trees (overfits the future); a future-dated check picks the right number.</text>
  <line x1="460" y1="432" x2="460" y2="458" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Band 4 -->
  <text x="60" y="476" font-size="12" fill="#898781">4 &#183; Result</text>
  <rect x="60" y="482" width="800" height="60" rx="10" fill="#2a78d6" stroke="#2a78d6"/>
  <text x="460" y="507" text-anchor="middle" font-size="15" font-weight="650" fill="#ffffff">CatBoost — PR-AUC 0.0860 = 2.13x the random baseline</text>
  <text x="460" y="527" text-anchor="middle" font-size="12" fill="#eaf1fb">Pass 2 tuning went from -0.018 (worse) to +0.0066 (better than Session 1's best)</text>
</svg>
